apiVersion: hanko.sh/v1alpha1
kind: HankoKeycloakInstance
metadata: {name: inventory-keycloak}
spec:
  mode: external
  adminRef: {name: inventory-credentials}
  tlsCARef: operator-ca
---
apiVersion: hanko.sh/v1alpha1
kind: HankoApplication
metadata:
  name: existing-portal
  annotations:
    hanko.sh/adoption-source: inventory-keycloak
spec:
  realmRef: example
  clientID: existing-portal
  mode: Observe
  type: spa
  redirectURIs: [https://existing.example.com/callback]
