apiVersion: hanko.sh/v1alpha1
kind: HankoOperation
metadata: {name: preview-upgrade}
spec:
  type: Upgrade
  instanceRef: inventory-keycloak
  dryRun: true
  upgrade:
    toImage: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
---
apiVersion: hanko.sh/v1alpha1
kind: HankoOperation
metadata: {name: preview-clone}
spec:
  type: Clone
  instanceRef: inventory-keycloak
  dryRun: true
  clone: {targetName: training-copy, includeData: false}
---
apiVersion: hanko.sh/v1alpha1
kind: HankoOperation
metadata: {name: preview-dbswitch}
spec:
  type: DBSwitch
  instanceRef: inventory-keycloak
  dryRun: true
  dbSwitch: {newDatabaseSecretRef: unconfigured-database}
